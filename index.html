```html
<script>
    const currentUser = localStorage.getItem("activeSessionUser");

    // FIREBASE DATABASE URL
    const firebaseDatabaseURL =
        "https://g2g1-31e7d-default-rtdb.firebaseio.com";



    // =========================
    // LOAD USER PROFILE
    // =========================

    if (currentUser) {

        document.getElementById(
            "nav-username-display"
        ).innerHTML =
        `<i class="fa-solid fa-user-astronaut"></i> ${currentUser}`;

        document.getElementById(
            "profile-username-val"
        ).innerText = currentUser;

        fetch(
            `${firebaseDatabaseURL}/users/${currentUser}.json`
        )
        .then(res => res.json())
        .then(userData => {

            if (userData) {

                document.getElementById(
                    "profile-email-val"
                ).innerText =
                    userData.email || "No Email Provided";

                document.getElementById(
                    "profile-discord-val"
                ).innerText =
                    userData.discord || "No Discord Provided";
            }

        });

    }



    // =========================
    // TAB SWITCH SYSTEM
    // =========================

    function switchTab(targetSlide) {

        const slides =
            document.querySelectorAll('.page-slide');

        slides.forEach(slide =>
            slide.classList.remove('active')
        );

        const navButtons =
            document.querySelectorAll('.nav-btn');

        navButtons.forEach(btn =>
            btn.classList.remove('active')
        );

        const target =
            document.getElementById(
                'slide-' + targetSlide
            );

        if (target)
            target.classList.add('active');

        const activeNav =
            document.getElementById(
                'nav-' + targetSlide
            );

        if (activeNav)
            activeNav.classList.add('active');

        if (targetSlide === 'profile') {
            loadMembersRegistry();
        }

        if (targetSlide === 'chat') {

            const chatLog =
                document.getElementById(
                    "chat-messages-log"
                );

            chatLog.scrollTop =
                chatLog.scrollHeight;
        }
    }



    // =========================
    // FIXED CHAT SYSTEM
    // =========================

    function loadChatMessages() {

        fetch(`${firebaseDatabaseURL}/chat.json`)
            .then(response => response.json())

            .then(data => {

                const chatLog =
                    document.getElementById(
                        "chat-messages-log"
                    );

                let chatHTML = "";

                // NO CHAT DATA
                if (!data || typeof data !== "object") {

                    chatLog.innerHTML = `
                        <div style="
                            color:#475569;
                            text-align:center;
                            padding-top:40px;
                        ">
                            No messages sent yet.
                        </div>
                    `;

                    return;
                }

                Object.keys(data).forEach(key => {

                    const msg = data[key];

                    // REMOVE BROKEN OBJECTS
                    if (
                        !msg ||
                        typeof msg !== "object" ||
                        !msg.sender ||
                        !msg.text ||
                        !msg.time
                    ) {
                        return;
                    }

                    const sender = msg.sender;
                    const text = msg.text;
                    const time = msg.time;

                    const isMeClass =
                        sender === currentUser
                        ? "msg-me"
                        : "msg-other";

                    chatHTML += `
                        <div class="chat-message-wrapper ${isMeClass}">

                            <div class="chat-msg-bubble">

                                <span class="chat-msg-author">
                                    ${sender}
                                </span>

                                <p class="chat-msg-text">
                                    ${text}
                                </p>

                                <span class="chat-msg-time">
                                    ${time}
                                </span>

                            </div>

                        </div>
                    `;

                });

                // IF ALL BROKEN
                if (chatHTML.trim() === "") {

                    chatHTML = `
                        <div style="
                            color:#475569;
                            text-align:center;
                            padding-top:40px;
                        ">
                            No valid messages found.
                        </div>
                    `;
                }

                chatLog.innerHTML = chatHTML;

                chatLog.scrollTop =
                    chatLog.scrollHeight;

            })

            .catch(err => {

                console.error(
                    "Chat loading error:",
                    err
                );

            });

    }



    // =========================
    // SEND CHAT MESSAGE
    // =========================

    function submitChatMessage(e) {

        e.preventDefault();

        const inputField =
            document.getElementById(
                "chat-message-text"
            );

        const msgText =
            inputField.value.trim();

        if (!msgText) return;

        let now = new Date();

        let timeString =
            now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });

        const newMsgPacket = {

            sender:
                currentUser || "GuestTrader",

            text: msgText,

            time: timeString

        };

        fetch(`${firebaseDatabaseURL}/chat.json`, {

            method: "POST",

            body: JSON.stringify(newMsgPacket),

            headers: {
                "Content-Type": "application/json"
            }

        })

        .then(() => {

            inputField.value = "";

            loadChatMessages();

        })

        .catch(err =>
            alert(
                "Cloud chat transmission failure: " + err
            )
        );

    }



    // =========================
    // AUTO RELOAD CHAT
    // =========================

    setInterval(loadChatMessages, 2000);



    // =========================
    // MEMBER REGISTRY
    // =========================

    function loadMembersRegistry() {

        const membersGrid =
            document.getElementById(
                "live-members-grid"
            );

        fetch(`${firebaseDatabaseURL}/users.json`)
            .then(res => res.json())

            .then(users => {

                let cardHTML = "";

                if (!users) {

                    membersGrid.innerHTML = `
                        <p style="color:#64748b;">
                            No registered users.
                        </p>
                    `;

                    return;
                }

                Object.keys(users).forEach(username => {

                    let uData = users[username];

                    if (!uData) return;

                    let isMeBadge =
                        (username === currentUser)
                        ? `<span class="me-pill">You</span>`
                        : "";

                    cardHTML += `
                        <div class="member-chip-card">

                            <div class="m-chip-header">

                                <span class="m-name">
                                    <i class="fa-solid fa-circle-user"></i>
                                    ${username || "Unknown User"}
                                </span>

                                ${isMeBadge}

                            </div>

                            <div class="m-details">

                                <p>
                                    <i class="fa-solid fa-envelope"></i>
                                    ${uData.email || "Hidden"}
                                </p>

                                <p>
                                    <i class="fa-brands fa-discord"></i>
                                    Discord:
                                    <span>
                                        ${uData.discord || "None"}
                                    </span>
                                </p>

                            </div>

                        </div>
                    `;

                });

                membersGrid.innerHTML = cardHTML;

            })

            .catch(err =>
                console.error(
                    "Could not sync registry:",
                    err
                )
            );

    }



    // =========================
    // REVIEWS SYSTEM
    // =========================

    function loadReviewsFromStorage() {

        const reviewContainer =
            document.getElementById(
                "dynamic-reviews-grid"
            );

        if (!reviewContainer) return;

        let defaultHTML = `
            <div class="review-box-p">

                <div class="r-top">

                    <span class="r-user">
                        <i class="fa-solid fa-circle-user"></i>
                        AlphaX
                    </span>

                    <span class="r-stars">
                        ⭐⭐⭐⭐⭐
                    </span>

                </div>

                <p>
                    "Trusted middleman and secure marketplace."
                </p>

                <span class="r-date">
                    <i class="fa-solid fa-clock"></i>
                    Verified Review
                </span>

            </div>
        `;

        let globalReviews =
            JSON.parse(
                localStorage.getItem(
                    "publicReviewsArray"
                )
            ) || [];

        globalReviews.forEach(rev => {

            if (!rev || !rev.text) return;

            let author =
                rev.author || "Unknown User";

            let stars =
                rev.stars || "⭐⭐⭐⭐⭐";

            let text =
                rev.text || "No review";

            defaultHTML = `
                <div class="review-box-p custom-user-review">

                    <div class="r-top">

                        <span class="r-user"
                        style="color:#3b82f6;">

                            <i class="fa-solid fa-circle-user text-blue"></i>

                            ${author}

                        </span>

                        <span class="r-stars">
                            ${stars}
                        </span>

                    </div>

                    <p>
                        "${text}"
                    </p>

                    <span class="r-date">
                        <i class="fa-solid fa-circle-nodes"></i>
                        Live Public Contribution
                    </span>

                </div>
            ` + defaultHTML;

        });

        reviewContainer.innerHTML =
            defaultHTML;
    }



    // =========================
    // SUBMIT REVIEW
    // =========================

    function submitLiveReview(e) {

        e.preventDefault();

        const starsSelection =
            document.getElementById(
                "review-stars-select"
            ).value;

        const reviewTextContent =
            document.getElementById(
                "review-text-input"
            ).value.trim();

        if (!reviewTextContent) {

            alert("Please enter a review.");

            return;
        }

        let globalReviews =
            JSON.parse(
                localStorage.getItem(
                    "publicReviewsArray"
                )
            ) || [];

        const newReviewPacket = {

            author:
                currentUser || "Anonymous",

            stars:
                starsSelection || "⭐⭐⭐⭐⭐",

            text:
                reviewTextContent

        };

        globalReviews.push(
            newReviewPacket
        );

        localStorage.setItem(
            "publicReviewsArray",
            JSON.stringify(globalReviews)
        );

        document.getElementById(
            "review-text-input"
        ).value = "";

        loadReviewsFromStorage();

    }



    // =========================
    // INITIAL LOAD
    // =========================

    loadReviewsFromStorage();

    loadChatMessages();



    // =========================
    // LOGOUT
    // =========================

    function logoutUser() {

        localStorage.removeItem(
            "isLoggedIn"
        );

        localStorage.removeItem(
            "activeSessionUser"
        );

        alert("Logging out securely...");

        window.location.replace(
            "./auth.html"
        );

    }

</script>
```
