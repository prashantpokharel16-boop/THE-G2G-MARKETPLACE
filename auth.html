<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G2G Escrow - Cryptographic Authorization</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page-body">
  <div class="auth-wrapper animate-fade-in">
    <div class="glass-container max-w-sm">
      <div class="glass-header text-center">
        <div class="auth-icon-wrap">
          <i data-lucide="lock" class="lock-brand"></i>
        </div>
        <h2 id="auth-title">Decrypt Node Lockbox</h2>
        <p id="auth-subtitle" class="subtitle">Establish authorized session with network gateways</p>
      </div>
      <div class="glass-body">
        
        <form id="auth-form" onsubmit="processAuth(event)">
          <div class="form-group">
            <label>Access Identity (Username)</label>
            <input type="text" id="auth-username" placeholder="Type your identity handle" required>
          </div>

          <!-- Non-mandatory for login -->
          <div class="form-group hidden" id="register-fields">
            <div class="form-group">
              <label>Communication Email</label>
              <input type="email" id="auth-email" placeholder="e.g. key@g2g.network">
            </div>
            <div class="form-group">
              <label>Discord Tag (Optional)</label>
              <input type="text" id="auth-discord" placeholder="username#1234">
            </div>
          </div>

          <div class="form-group">
            <label>Decryption Password Key</label>
            <input type="password" id="auth-password" placeholder="••••••••••••••" required>
          </div>

          <div id="auth-error-output" class="error-panel hidden">
            <!-- Error message will output here on incorrect inputs -->
          </div>

          <button type="submit" class="btn btn-primary w-full" id="auth-submit-btn">
            Decrypt Profile Credentials
          </button>
        </form>

        <div class="auth-switch-footer">
          <button class="btn-link" id="auth-toggle-btn" onclick="toggleAuthMode()">
            Initialize new secure account registry
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // In auth.html, initialization scripts
    lucide.createIcons();
  </script>
</body>
</html>
