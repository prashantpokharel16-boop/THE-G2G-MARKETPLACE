<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Gateway - Access Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        .auth-container-shell {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .auth-card {
            background: #0b1329;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-top-left-radius: 16px; border-top-right-radius: 16px;
        }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header i { font-size: 2.5rem; color: #3b82f6; margin-bottom: 15px; }
        .auth-header h2 { font-size: 1.6rem; color: #fff; font-weight: 800; }
        .auth-header p { color: #64748b; font-size: 0.88rem; margin-top: 5px; }
        
        .form-input-wrapper { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .form-input-wrapper label { font-size: 0.78rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-icon-row { position: relative; }
        .input-icon-row i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 0.95rem; }
        .input-icon-row input {
            width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 8px;
            padding: 13px 14px 13px 42px; color: white; font-size: 0.95rem; transition: all 0.2s;
        }
        .input-icon-row input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        
        .auth-toggle-hint { text-align: center; margin-top: 25px; font-size: 0.88rem; color: #64748b; }
        .auth-toggle-hint span { color: #3b82f6; cursor: pointer; font-weight: 600; text-decoration: underline; }
        .auth-toggle-hint span:hover { color: #2563eb; }
        
        .btn-full { width: 100%; justify-content: center; padding: 13px; font-size: 0.95rem; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-container-shell">
        <!-- ACCESS LOGIN CONTAINER SCREEN -->
        <div id="box-login" class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-lock"></i>
                <h2>Operator Login Terminal</h2>
                <p>Provide valid operational credentials to unlock the deck</p>
            </div>
            
            <form onsubmit="handleLogIn(event)">
                <div class="form-input-wrapper">
                    <label>Username Account ID</label>
                    <div class="input-icon-row">
                        <i class="fa-solid fa-user-astronaut"></i>
                        <input type="text" id="login-user" placeholder="Enter username..." autocomplete="off" required>
                    </div>
                </div>
                <div class="form-input-wrapper">
                    <label>Security Password Hash</label>
                    <div class="input-icon-row">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="login-pass" placeholder="Enter security passphrase..." required>
                    </div>
                </div>
                <button type="submit" class="btn btn-discord btn-full"><i class="fa-solid fa-right-to-bracket"></i> UNLOCK SYSTEM ACCESS</button>
            </form>
            
            <div class="auth-toggle-hint">
                New network contractor? <span onclick="togglePanels('register')">Register Account Key</span>
            </div>
        </div>

        <!-- NEW IDENTITY REGISTRATION CONTAINER SCREEN -->
        <div id="box-register" class="auth-card" style="display: none;">
            <div class="auth-header">
                <i class="fa-solid fa-user-plus"></i>
                <h2>Create Identity Profile</h2>
                <p>Register parameters securely onto the cloud database</p>
            </div>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-input-wrapper">
                    <label>Choose Username Access ID</label>
                    <div class="input-icon-row">
                        <i class="fa-solid fa-user-tag"></i>
                        <input type="text" id="reg-user" placeholder="Create alphanumeric user ID..." autocomplete="off" required>
                    </div>
                </div>
                <div class="form-input-wrapper">
                    <label>Contact Email Hash</label>
                    <div class="input-icon-row">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="user@domain.com" autocomplete="off" required>
                    </div>
                </div>
                <div class="form-input-wrapper">
                    <label>Discord Identity String</label>
                    <div class="input-icon-row">
                        <i class="fa-brands fa-discord"></i>
                        <input type="text" id="reg-discord" placeholder="username or global name" autocomplete="off" required>
                    </div>
                </div>
                <div class="form-input-wrapper">
                    <label>Account Passphrase Lock</label>
                    <div class="input-icon-row">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="password" id="reg-pass" placeholder="Construct a resilient password..." required>
                    </div>
                </div>
                <button type="submit" class="btn btn-discord btn-full" style="background-color: #10b981;"><i class="fa-solid fa-id-card"></i> GENERATE NEW IDENTITY</button>
            </form>
            
            <div class="auth-toggle-hint">
                Already have an active pass? <span onclick="togglePanels('login')">Return to Login Terminal</span>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ PASTE YOUR REALTIME DATABASE URL LINK RIGHT BELOW HERE (NO '/' AT THE END):
        const firebaseDatabaseURL = "YOUR_FIREBASE_DATABASE_URL_HERE";

        function togglePanels(panelTarget) {
            if (panelTarget === 'register') {
                document.getElementById("box-login").style.display = "none";
                document.getElementById("box-register").style.display = "block";
            } else {
                document.getElementById("box-register").style.display = "none";
                document.getElementById("box-login").style.display = "block";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const usernameInput = document.getElementById("reg-user").value.trim();
            const emailInput = document.getElementById("reg-email").value.trim();
            const discordInput = document.getElementById("reg-discord").value.trim();
            const passwordInput = document.getElementById("reg-pass").value;

            if (firebaseDatabaseURL.includes("YOUR_FIREBASE_DATABASE_URL_HERE")) {
                alert("Configuration Error: Add your Firebase URL link inside auth.html on line 115!");
                return;
            }

            // First check if user already exists globally on Firebase
            fetch(`${firebaseDatabaseURL}/users/${usernameInput}.json`)
                .then(res => res.json())
                .then(existingUser => {
                    if (existingUser) {
                        alert("Identity Allocation Failed: This Username ID is already taken by another user globally.");
                        return;
                    }

                    // Write profile straight into global database cluster
                    const userProfilePacket = {
                        username: usernameInput,
                        email: emailInput,
                        discord: discordInput,
                        password: passwordInput
                    };

                    return fetch(`${firebaseDatabaseURL}/users/${usernameInput}.json`, {
                        method: "PUT",
                        body: JSON.stringify(userProfilePacket),
                        headers: { "Content-Type": "application/json" }
                    });
                })
                .then(response => {
                    if(!response) return; 
                    alert("Identity profile generated globally across cloud node! Transferring to login terminal...");
                    togglePanels('login');
                })
                .catch(err => alert("Cloud registration pipeline failure: " + err));
        }

        function handleLogIn(e) {
            e.preventDefault();
            const userCheck = document.getElementById("login-user").value.trim();
            const passCheck = document.getElementById("login-pass").value;

            if (firebaseDatabaseURL.includes("YOUR_FIREBASE_DATABASE_URL_HERE")) {
                alert("Configuration Error: Add your Firebase URL link inside auth.html on line 115!");
                return;
            }

            // Authenticate directly by polling user record from Firebase
            fetch(`${firebaseDatabaseURL}/users/${userCheck}.json`)
                .then(res => res.json())
                .then(globalUserData => {
                    if (globalUserData && globalUserData.password === passCheck) {
                        localStorage.setItem("isLoggedIn", "true");
                        localStorage.setItem("activeSessionUser", userCheck);
                        alert("Security handshake success. Relaying parameters to control hub...");
                        window.location.href = "./index.html";
                    } else {
                        alert("Access Denied: Invalid Operator ID or password hash matches nothing in the cloud registry.");
                    }
                })
                .catch(err => alert("Database system access timeout: " + err));
        }
    </script>
</body>
</html>
